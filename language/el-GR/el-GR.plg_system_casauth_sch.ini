PLG_SYSTEM_CASAUTH_SCH_AUTO_REDIRECT_LOGIN="Αυτόματη ανακατεύθυνση στο ΠΣΔ"
PLG_SYSTEM_CASAUTH_SCH_AUTO_REDIRECT_LOGIN_DESC="Αν ενεργοποιηθεί, κάθε επίσκεψη στη σελίδα σύνδεσης του Joomla θα ξεκινά αυτόματα τη σύνδεση μέσω ΠΣΔ. Αν μείνει ανενεργό, θα παραμένει διαθέσιμο και το τοπικό login του Joomla μαζί με ξεχωριστό κουμπί ΠΣΔ."
PLG_SYSTEM_CASAUTH_SCH_ENABLE_ADMIN_SSO="Ενεργοποίηση σύνδεσης διαχείρισης μέσω ΠΣΔ"
PLG_SYSTEM_CASAUTH_SCH_ENABLE_ADMIN_SSO_DESC="Εμφανίζει κουμπί ΠΣΔ στη σελίδα σύνδεσης του /administrator και χρησιμοποιεί το υπάρχον frontend callback για να συνεχίσει στη διαχείριση. Απαιτεί ενεργά Shared Sessions και λειτουργεί μόνο για ήδη υπάρχοντες τοπικούς χρήστες Joomla που έχουν ήδη δικαίωμα πρόσβασης στο backend."
PLG_SYSTEM_CASAUTH_SCH_HOST="Διεύθυνση εξυπηρετητή CAS"
PLG_SYSTEM_CASAUTH_SCH_HOST_DESC="Το hostname του εξυπηρετητή SSO του ΠΣΔ. Για δοκιμές συνήθως είναι sso-01-test.sch.gr, ενώ στην παραγωγή sso.sch.gr."
PLG_SYSTEM_CASAUTH_SCH_HOST_HINT="π.χ. sso.sch.gr"
PLG_SYSTEM_CASAUTH_SCH_PORT="Θύρα CAS"
PLG_SYSTEM_CASAUTH_SCH_PORT_DESC="Η θύρα HTTPS του εξυπηρετητή CAS. Συνήθως είναι 443."
PLG_SYSTEM_CASAUTH_SCH_PORT_HINT="π.χ. 443"
PLG_SYSTEM_CASAUTH_SCH_CONTEXT="Διαδρομή CAS"
PLG_SYSTEM_CASAUTH_SCH_CONTEXT_DESC="Η βασική διαδρομή της υπηρεσίας CAS στον εξυπηρετητή. Συνήθως αφήνεται /, εκτός αν το ΠΣΔ δώσει διαφορετική τιμή."
PLG_SYSTEM_CASAUTH_SCH_CONTEXT_HINT="π.χ. /"
PLG_SYSTEM_CASAUTH_SCH_SERVICE_URL="Καταχωρημένο Service URL"
PLG_SYSTEM_CASAUTH_SCH_SERVICE_URL_DESC="Το ακριβές HTTPS callback URL που έχει δηλωθεί στο ΠΣΔ για την υπηρεσία σας. Αν το αφήσετε κενό, χρησιμοποιείται το προεπιλεγμένο callback URL του plugin."
PLG_SYSTEM_CASAUTH_SCH_SERVICE_URL_HINT="π.χ. https://ionidios.sch.gr/index.php?option=com_users&view=login&casauth_sch=1"
PLG_SYSTEM_CASAUTH_SCH_CA_CERT="Αρχείο CA bundle (PEM)"
PLG_SYSTEM_CASAUTH_SCH_CA_CERT_DESC="Απόλυτο path προς το PEM αρχείο trusted certificates που χρησιμοποιείται για τον έλεγχο του πιστοποιητικού του ΠΣΔ. Παράδειγμα: /var/www/vhosts/.../.certs/cacert.pem"
PLG_SYSTEM_CASAUTH_SCH_CA_CERT_HINT="π.χ. /var/www/vhosts/.../.certs/cacert.pem"
PLG_SYSTEM_CASAUTH_SCH_USERNAME_ATTRIBUTE="CAS attribute ονόματος χρήστη"
PLG_SYSTEM_CASAUTH_SCH_USERNAME_ATTRIBUTE_DESC="Το attribute του ΠΣΔ που θα χρησιμοποιηθεί ως προτιμώμενο τοπικό username. Αν μείνει κενό, χρησιμοποιείται το CAS principal / uid."
PLG_SYSTEM_CASAUTH_SCH_USERNAME_ATTRIBUTE_HINT="CAS principal / uid"
PLG_SYSTEM_CASAUTH_SCH_MAIL_ATTRIBUTE="CAS attribute e-mail"
PLG_SYSTEM_CASAUTH_SCH_MAIL_ATTRIBUTE_DESC="Το attribute του ΠΣΔ που επιστρέφει το e-mail του χρήστη. Συνήθως είναι mail."
PLG_SYSTEM_CASAUTH_SCH_MAIL_ATTRIBUTE_HINT="mail"
PLG_SYSTEM_CASAUTH_SCH_FULLNAME_ATTRIBUTE="CAS attribute ονοματεπωνύμου"
PLG_SYSTEM_CASAUTH_SCH_FULLNAME_ATTRIBUTE_DESC="Το attribute του ΠΣΔ που επιστρέφει το πλήρες όνομα του χρήστη. Συνήθως είναι cn."
PLG_SYSTEM_CASAUTH_SCH_FULLNAME_ATTRIBUTE_HINT="cn"
PLG_SYSTEM_CASAUTH_SCH_AUTO_CREATE="Αυτόματη δημιουργία χρηστών Joomla"
PLG_SYSTEM_CASAUTH_SCH_AUTO_CREATE_DESC="Αν ενεργοποιηθεί, το plugin θα δημιουργεί νέο τοπικό χρήστη Joomla όταν ένας λογαριασμός ΠΣΔ συνδέεται για πρώτη φορά και δεν υπάρχει ήδη αντιστοίχιση."
PLG_SYSTEM_CASAUTH_SCH_SYNC_PROFILE="Συγχρονισμός στοιχείων υπάρχοντος χρήστη"
PLG_SYSTEM_CASAUTH_SCH_SYNC_PROFILE_DESC="Αν ενεργοποιηθεί, το e-mail του τοπικού χρήστη θα ενημερώνεται από τα στοιχεία που επιστρέφει το ΠΣΔ σε κάθε επιτυχημένη σύνδεση. Το όνομα θα ενημερώνεται μόνο όσο παραμένει ίδιο με το τελευταίο όνομα που είχε εισαχθεί από το ΠΣΔ, ώστε να διατηρούνται τυχόν τοπικές αλλαγές."
PLG_SYSTEM_CASAUTH_SCH_LOG_CAS_ATTRIBUTES="Διαγνωστική καταγραφή CAS"
PLG_SYSTEM_CASAUTH_SCH_LOG_CAS_ATTRIBUTES_DESC="Καταγράφει προσωρινά διαγνωστικές πληροφορίες για τη ροή σύνδεσης/αποσύνδεσης και τα στοιχεία που επιστρέφει το ΠΣΔ. Να ενεργοποιείται μόνο όταν χρειάζεται έλεγχος και να απενεργοποιείται αμέσως μετά, ώστε να μην καταγράφονται προσωπικά δεδομένα χωρίς λόγο."
PLG_SYSTEM_CASAUTH_SCH_DEFAULT_GROUP="Προεπιλεγμένη ομάδα νέων χρηστών"
PLG_SYSTEM_CASAUTH_SCH_DEFAULT_GROUP_DESC="Εφεδρική ομάδα Joomla για νέους χρήστες που δημιουργούνται αυτόματα, όταν δεν ταιριάζει κάποια ειδική αντιστοίχιση umdobject."
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP="Προεπιλεγμένες ομάδες ανά umdobject"
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_DESC="Προαιρετικές αντιστοιχίσεις που εφαρμόζονται μόνο όταν δημιουργείται αυτόματα νέος χρήστης Joomla. Αν το umdobject που επιστρέφει το ΠΣΔ ταιριάζει με μία από τις παρακάτω γραμμές, θα χρησιμοποιηθεί η αντίστοιχη ομάδα Joomla αντί για την εφεδρική προεπιλεγμένη ομάδα."
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_UMDOBJECT="Τιμή umdobject"
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_UMDOBJECT_HINT="π.χ. Teacher"
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_GROUP="Ομάδα Joomla"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UMDOBJECT="Επιτρεπόμενες τιμές umdobject"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UMDOBJECT_DESC="Προαιρετικό φίλτρο τύπου λογαριασμού. Βάλτε τιμές χωρισμένες με κόμμα, π.χ. Teacher, Student. Αφήστε κενό για να επιτρέπονται όλοι οι τύποι."
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UMDOBJECT_HINT="π.χ. Teacher,Student"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_BUSINESS_CATEGORY="Επιτρεπόμενες τιμές businessCategory"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_BUSINESS_CATEGORY_DESC="Προαιρετικό φίλτρο κατηγορίας φορέα ή μονάδας, όπως επιστρέφεται από το ΠΣΔ. Αφήστε κενό αν δεν θέλετε περιορισμό με βάση αυτό το attribute."
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_BUSINESS_CATEGORY_HINT="π.χ. Secondary Education,School"
PLG_SYSTEM_CASAUTH_SCH_UNIT_CODE_ATTRIBUTE="CAS attribute κωδικού μονάδας"
PLG_SYSTEM_CASAUTH_SCH_UNIT_CODE_ATTRIBUTE_DESC="Το attribute του ΠΣΔ που χρησιμοποιείται για τον έλεγχο της σχολικής μονάδας. Συνήθως είναι edupersonorgunitdn-gsnunitcode-extended."
PLG_SYSTEM_CASAUTH_SCH_UNIT_CODE_ATTRIBUTE_HINT="edupersonorgunitdn-gsnunitcode-extended"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UNIT_CODES="Επιτρεπόμενοι κωδικοί σχολικής μονάδας"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UNIT_CODES_DESC="Προαιρετική λίστα κωδικών μονάδας του ΠΣΔ, χωρισμένων με κόμμα. Παράδειγμα: 0551904. Μόνο χρήστες που ανήκουν σε μία από αυτές τις μονάδες θα μπορούν να συνδεθούν."
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UNIT_CODES_HINT="π.χ. 0551904"
PLG_SYSTEM_CASAUTH_SCH_LOGOUT_URL="URL αποσύνδεσης CAS"
PLG_SYSTEM_CASAUTH_SCH_LOGOUT_URL_DESC="Το HTTPS logout endpoint του εξυπηρετητή CAS. Για δοκιμές συνήθως είναι https://sso-01-test.sch.gr/logout, ενώ στην παραγωγή https://sso-01.sch.gr/logout."
PLG_SYSTEM_CASAUTH_SCH_LOGOUT_URL_HINT="π.χ. https://sso-01.sch.gr/logout"
PLG_SYSTEM_CASAUTH_SCH_LOGIN_BUTTON_LABEL="Σύνδεση μέσω ΠΣΔ"
PLG_SYSTEM_CASAUTH_SCH_LOGIN_BUTTON_DESC="Εκκίνηση frontend CAS σύνδεσης μέσω του Πανελλήνιου Σχολικού Δικτύου."
PLG_SYSTEM_CASAUTH_SCH_ADMIN_LOGIN_BUTTON_DESC="Εκκίνηση σύνδεσης διαχείρισης Joomla μέσω του Πανελλήνιου Σχολικού Δικτύου."
PLG_SYSTEM_CASAUTH_SCH_USER_GROUP_LABEL="ΠΣΔ / CAS"
PLG_SYSTEM_CASAUTH_SCH_USER_GROUP_DESC="Αποθηκευμένη αντιστοίχιση CAS για αυτόν τον χρήστη Joomla. Η εκκαθάριση του link ενεργοποιεί αυτόματα και το μπλοκάρισμα επανασύνδεσης."
PLG_SYSTEM_CASAUTH_SCH_USER_UID_LABEL="Συνδεδεμένο CAS UID"
PLG_SYSTEM_CASAUTH_SCH_USER_MAIL_LABEL="Τελευταίο e-mail ΠΣΔ"
PLG_SYSTEM_CASAUTH_SCH_USER_FULLNAME_LABEL="Τελευταίο πλήρες όνομα ΠΣΔ"
PLG_SYSTEM_CASAUTH_SCH_USER_LINKED_AT_LABEL="Ημερομηνία σύνδεσης"
PLG_SYSTEM_CASAUTH_SCH_USER_LAST_LOGIN_AT_LABEL="Τελευταία σύνδεση ΠΣΔ"
PLG_SYSTEM_CASAUTH_SCH_USER_AUTOLINK_BLOCKED_LABEL="Αποτροπή αυτόματης αντιστοίχισης CAS"
PLG_SYSTEM_CASAUTH_SCH_USER_AUTOLINK_BLOCKED_DESC="Αν ενεργοποιηθεί, αυτός ο χρήστης Joomla δεν θα επιλέγεται ποτέ αυτόματα από αντιστοίχιση e-mail ΠΣΔ."
PLG_SYSTEM_CASAUTH_SCH_USER_CLEAR_LINK_LABEL="Εκκαθάριση CAS link στην αποθήκευση"
PLG_SYSTEM_CASAUTH_SCH_USER_CLEAR_LINK_DESC="Διαγράφει το αποθηκευμένο CAS link για αυτόν τον χρήστη και ενεργοποιεί αυτόματα το μπλοκάρισμα αυτόματης αντιστοίχισης."
PLG_SYSTEM_CASAUTH_SCH_ERROR_MISSING_VENDOR="Η ενσωματωμένη βιβλιοθήκη phpCAS λείπει από την εγκατάσταση του plugin."
PLG_SYSTEM_CASAUTH_SCH_ERROR_INVALID_HOST="Η διεύθυνση CAS δεν έχει ρυθμιστεί σωστά."
PLG_SYSTEM_CASAUTH_SCH_ERROR_INVALID_CA_CERT="Απαιτείται αναγνώσιμο PEM CA bundle για την επικύρωση του πιστοποιητικού CAS του ΠΣΔ."
PLG_SYSTEM_CASAUTH_SCH_ERROR_INVALID_SERVICE_URL="Το CAS service URL πρέπει να είναι απόλυτο HTTPS URL."
PLG_SYSTEM_CASAUTH_SCH_ERROR_INVALID_LOGOUT_URL="Το CAS logout URL πρέπει να είναι απόλυτο HTTPS URL."
PLG_SYSTEM_CASAUTH_SCH_ERROR_INVALID_USERNAME="Το CAS δεν επέστρεψε έγκυρο όνομα χρήστη."
PLG_SYSTEM_CASAUTH_SCH_ERROR_MISSING_EMAIL="Ο λογαριασμός ΠΣΔ δεν επέστρεψε έγκυρη διεύθυνση e-mail, η οποία απαιτείται από την ιστοσελίδα."
PLG_SYSTEM_CASAUTH_SCH_ERROR_CREATE_USER="Απέτυχε η αυτόματη δημιουργία του χρήστη Joomla."
PLG_SYSTEM_CASAUTH_SCH_ERROR_SYNC_USER="Απέτυχε ο συγχρονισμός του προφίλ χρήστη Joomla."
PLG_SYSTEM_CASAUTH_SCH_ERROR_USER_NOT_FOUND="Δεν βρέθηκε χρήστης Joomla για τον CAS λογαριασμό και η αυτόματη δημιουργία είναι απενεργοποιημένη."
PLG_SYSTEM_CASAUTH_SCH_ERROR_ADMIN_USER_NOT_FOUND="Η σύνδεση διαχείρισης μέσω ΠΣΔ είναι διαθέσιμη μόνο για ήδη υπάρχοντες χρήστες Joomla που έχουν δικαίωμα πρόσβασης στο backend."
PLG_SYSTEM_CASAUTH_SCH_ERROR_USER_DISABLED="Ο λογαριασμός σας στην ιστοσελίδα είναι απενεργοποιημένος. Παρακαλούμε επικοινωνήστε με τον διαχειριστή."
PLG_SYSTEM_CASAUTH_SCH_ERROR_ADMIN_SHARED_SESSION="Η σύνδεση διαχείρισης μέσω ΠΣΔ απαιτεί να είναι ενεργά τα Shared Sessions στη Γενική Διαμόρφωση του Joomla."
PLG_SYSTEM_CASAUTH_SCH_ERROR_ADMIN_ACCESS_DENIED="Ο λογαριασμός σας δεν έχει δικαίωμα πρόσβασης στη διαχείριση της ιστοσελίδας."
PLG_SYSTEM_CASAUTH_SCH_ERROR_AUTO_LINK_BLOCKED="Η σύνδεση μέσω ΠΣΔ δεν είναι διαθέσιμη για αυτόν τον λογαριασμό στην ιστοσελίδα. Παρακαλούμε επικοινωνήστε με τον διαχειριστή."
PLG_SYSTEM_CASAUTH_SCH_ERROR_LOCAL_LOGIN="Η ταυτοποίηση μέσω CAS πέτυχε, αλλά το Joomla δεν μπόρεσε να δημιουργήσει το τοπικό session."
PLG_SYSTEM_CASAUTH_SCH_ERROR_LOCAL_LOGOUT="Το Joomla δεν μπόρεσε να ολοκληρώσει την τοπική αποσύνδεση πριν την ανακατεύθυνση στο logout του ΠΣΔ."
PLG_SYSTEM_CASAUTH_SCH_ERROR_UMDOBJECT="Η σύνδεση μέσω ΠΣΔ δεν είναι διαθέσιμη για τον τύπο λογαριασμού σας στην παρούσα ιστοσελίδα."
PLG_SYSTEM_CASAUTH_SCH_ERROR_BUSINESS_CATEGORY="Η σύνδεση μέσω ΠΣΔ δεν είναι διαθέσιμη για την κατηγορία λογαριασμού σας στην παρούσα ιστοσελίδα."
PLG_SYSTEM_CASAUTH_SCH_ERROR_UNIT_CODE="Ο λογαριασμός ΠΣΔ δεν ανήκει σε επιτρεπόμενη σχολική μονάδα."
PLG_SYSTEM_CASAUTH_SCH_ERROR_USERNAME_UNAVAILABLE="Το Joomla δεν μπόρεσε να δεσμεύσει ασφαλές τοπικό username για αυτόν τον λογαριασμό ΠΣΔ."
