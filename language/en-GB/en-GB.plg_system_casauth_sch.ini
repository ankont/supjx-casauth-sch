PLG_SYSTEM_CASAUTH_SCH_AUTO_REDIRECT_LOGIN="Automatically redirect to Greek School Network"
PLG_SYSTEM_CASAUTH_SCH_AUTO_REDIRECT_LOGIN_DESC="If enabled, every visit to the Joomla login page will immediately start Greek School Network login. Leave disabled to keep Joomla local login available alongside a separate Greek School Network button."
PLG_SYSTEM_CASAUTH_SCH_HOST="CAS server host"
PLG_SYSTEM_CASAUTH_SCH_HOST_DESC="The hostname of the Greek School Network SSO server. For testing this is usually sso-01-test.sch.gr, while production typically uses sso.sch.gr."
PLG_SYSTEM_CASAUTH_SCH_HOST_HINT="e.g. sso.sch.gr"
PLG_SYSTEM_CASAUTH_SCH_PORT="CAS port"
PLG_SYSTEM_CASAUTH_SCH_PORT_DESC="The HTTPS port of the CAS server. This is usually 443."
PLG_SYSTEM_CASAUTH_SCH_PORT_HINT="e.g. 443"
PLG_SYSTEM_CASAUTH_SCH_CONTEXT="CAS path"
PLG_SYSTEM_CASAUTH_SCH_CONTEXT_DESC="The base path of the CAS service on the server. Usually this should remain / unless the Greek School Network gives you a different value."
PLG_SYSTEM_CASAUTH_SCH_CONTEXT_HINT="e.g. /"
PLG_SYSTEM_CASAUTH_SCH_SERVICE_URL="Registered Service URL"
PLG_SYSTEM_CASAUTH_SCH_SERVICE_URL_DESC="The exact HTTPS callback URL registered with the Greek School Network for this service. If left empty, the plugin uses its default callback URL."
PLG_SYSTEM_CASAUTH_SCH_SERVICE_URL_HINT="e.g. https://ionidios.sch.gr/index.php?option=com_users&view=login&casauth_sch=1"
PLG_SYSTEM_CASAUTH_SCH_CA_CERT="CA bundle file (PEM)"
PLG_SYSTEM_CASAUTH_SCH_CA_CERT_DESC="Absolute path to the PEM bundle of trusted certificates used to validate the Greek School Network certificate. Example: /var/www/vhosts/.../.certs/cacert.pem"
PLG_SYSTEM_CASAUTH_SCH_CA_CERT_HINT="e.g. /var/www/vhosts/.../.certs/cacert.pem"
PLG_SYSTEM_CASAUTH_SCH_USERNAME_ATTRIBUTE="CAS username attribute"
PLG_SYSTEM_CASAUTH_SCH_USERNAME_ATTRIBUTE_DESC="The Greek School Network attribute to use as the preferred local username. If left empty, the CAS principal / uid is used."
PLG_SYSTEM_CASAUTH_SCH_USERNAME_ATTRIBUTE_HINT="CAS principal / uid"
PLG_SYSTEM_CASAUTH_SCH_MAIL_ATTRIBUTE="CAS email attribute"
PLG_SYSTEM_CASAUTH_SCH_MAIL_ATTRIBUTE_DESC="The Greek School Network attribute that returns the user's email address. This is usually mail."
PLG_SYSTEM_CASAUTH_SCH_MAIL_ATTRIBUTE_HINT="mail"
PLG_SYSTEM_CASAUTH_SCH_FULLNAME_ATTRIBUTE="CAS full name attribute"
PLG_SYSTEM_CASAUTH_SCH_FULLNAME_ATTRIBUTE_DESC="The Greek School Network attribute that returns the user's full name. This is usually cn."
PLG_SYSTEM_CASAUTH_SCH_FULLNAME_ATTRIBUTE_HINT="cn"
PLG_SYSTEM_CASAUTH_SCH_AUTO_CREATE="Automatically create Joomla users"
PLG_SYSTEM_CASAUTH_SCH_AUTO_CREATE_DESC="If enabled, the plugin creates a new local Joomla user when a Greek School Network account logs in for the first time and no existing match is found."
PLG_SYSTEM_CASAUTH_SCH_SYNC_PROFILE="Synchronize existing user data"
PLG_SYSTEM_CASAUTH_SCH_SYNC_PROFILE_DESC="If enabled, the local Joomla user's name and email are refreshed from Greek School Network data on each successful login."
PLG_SYSTEM_CASAUTH_SCH_LOG_CAS_ATTRIBUTES="CAS diagnostic logging"
PLG_SYSTEM_CASAUTH_SCH_LOG_CAS_ATTRIBUTES_DESC="Temporarily logs diagnostic information for login/logout flow and the data returned by the Greek School Network. Enable it only when troubleshooting and disable it immediately afterwards, so personal data is not logged unnecessarily."
PLG_SYSTEM_CASAUTH_SCH_DEFAULT_GROUP="Default group for new users"
PLG_SYSTEM_CASAUTH_SCH_DEFAULT_GROUP_DESC="Fallback Joomla group for newly created local users when no umdobject-specific group mapping matches."
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP="Default groups by umdobject"
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_DESC="Optional mappings used only when a new Joomla user is created automatically. If the returned umdobject matches one of the rows below, that Joomla group is used instead of the fallback default group."
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_UMDOBJECT="umdobject value"
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_UMDOBJECT_HINT="e.g. Teacher"
PLG_SYSTEM_CASAUTH_SCH_UMDOBJECT_GROUP_MAP_GROUP="Joomla group"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UMDOBJECT="Allowed umdobject values"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UMDOBJECT_DESC="Optional account-type filter. Enter comma-separated values such as Teacher or Student. Leave empty to allow all account types."
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UMDOBJECT_HINT="e.g. Teacher,Student"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_BUSINESS_CATEGORY="Allowed businessCategory values"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_BUSINESS_CATEGORY_DESC="Optional organization-category filter, using the businessCategory value returned by the Greek School Network. Leave empty if you do not want to restrict access with this attribute."
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_BUSINESS_CATEGORY_HINT="e.g. Secondary Education,School"
PLG_SYSTEM_CASAUTH_SCH_UNIT_CODE_ATTRIBUTE="CAS unit code attribute"
PLG_SYSTEM_CASAUTH_SCH_UNIT_CODE_ATTRIBUTE_DESC="The Greek School Network attribute used to evaluate school-unit restrictions. This is usually edupersonorgunitdn-gsnunitcode-extended."
PLG_SYSTEM_CASAUTH_SCH_UNIT_CODE_ATTRIBUTE_HINT="edupersonorgunitdn-gsnunitcode-extended"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UNIT_CODES="Allowed school unit codes"
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UNIT_CODES_DESC="Optional comma-separated list of Greek School Network school unit codes. Example: 0551904. Only users belonging to one of these units will be allowed to sign in."
PLG_SYSTEM_CASAUTH_SCH_ALLOWED_UNIT_CODES_HINT="e.g. 0551904"
PLG_SYSTEM_CASAUTH_SCH_LOGOUT_URL="CAS logout URL"
PLG_SYSTEM_CASAUTH_SCH_LOGOUT_URL_DESC="The HTTPS logout endpoint of the CAS server. For testing this is usually https://sso-01-test.sch.gr/logout, while production typically uses https://sso-01.sch.gr/logout."
PLG_SYSTEM_CASAUTH_SCH_LOGOUT_URL_HINT="e.g. https://sso-01.sch.gr/logout"
PLG_SYSTEM_CASAUTH_SCH_LOGIN_BUTTON_LABEL="Login with Greek School Network"
PLG_SYSTEM_CASAUTH_SCH_LOGIN_BUTTON_DESC="Start a frontend CAS login through the Greek School Network."
PLG_SYSTEM_CASAUTH_SCH_USER_GROUP_LABEL="Greek School Network / CAS"
PLG_SYSTEM_CASAUTH_SCH_USER_GROUP_DESC="Stored CAS account link for this Joomla user. Clearing the link also blocks automatic relinking until you re-enable it."
PLG_SYSTEM_CASAUTH_SCH_USER_UID_LABEL="Linked CAS UID"
PLG_SYSTEM_CASAUTH_SCH_USER_MAIL_LABEL="Last CAS email"
PLG_SYSTEM_CASAUTH_SCH_USER_FULLNAME_LABEL="Last CAS full name"
PLG_SYSTEM_CASAUTH_SCH_USER_LINKED_AT_LABEL="Linked at"
PLG_SYSTEM_CASAUTH_SCH_USER_LAST_LOGIN_AT_LABEL="Last CAS login"
PLG_SYSTEM_CASAUTH_SCH_USER_AUTOLINK_BLOCKED_LABEL="Prevent automatic CAS linking"
PLG_SYSTEM_CASAUTH_SCH_USER_AUTOLINK_BLOCKED_DESC="If enabled, this Joomla user will never be picked automatically by CAS email matching."
PLG_SYSTEM_CASAUTH_SCH_USER_CLEAR_LINK_LABEL="Clear CAS link on save"
PLG_SYSTEM_CASAUTH_SCH_USER_CLEAR_LINK_DESC="Removes the stored CAS link for this user and automatically enables the auto-link block."
